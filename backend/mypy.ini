[mypy]
ignore_missing_imports = True
; This codebase uses SQLAlchemy's classic Column()-declarative style
; (not Mapped[]), and SQLAlchemy 2.x no longer ships a mypy plugin for
; that style, so `Column[T]` vs `T` false positives are expected on
; ORM attribute access — see the CI workflow's comment on why this
; check is non-blocking for now rather than either suppressed outright
; or gating merges on a class of error the toolchain can't resolve.
