name: aerotwin
version: '3.9'

services:
  # ── PostgreSQL + TimescaleDB ──
  db:
    image: timescale/timescaledb:latest-pg16
    container_name: aerotwin-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: aerotwin
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ── Redis (caching / pub-sub) ──
  redis:
    image: redis:7-alpine
    container_name: aerotwin-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ── MQTT Broker ──
  mqtt:
    image: eclipse-mosquitto:2
    container_name: aerotwin-mqtt
    restart: unless-stopped
    ports:
      - "1883:1883"
      - "9001:9001"
    volumes:
      - ./mosquitto.conf:/mosquitto/config/mosquitto.conf
    healthcheck:
      test: ["CMD-SHELL", "mosquitto_sub -t '$$SYS/#' -C 1 -i healthcheck -W 3 || exit 0"]
      interval: 10s
      timeout: 5s
      retries: 3

  # ── FastAPI Backend ──
  backend:
    build:
      # Repo root: the image needs ml/ and simulation/ as well as backend/.
      context: ../..
      dockerfile: infra/docker/Dockerfile.backend
    container_name: aerotwin-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - ../../backend:/app
      - ../../ml:/ml
      - ../../simulation:/simulation
      # Mount Docker socket so the backend can start/stop the simulator container on demand.
      - /var/run/docker.sock:/var/run/docker.sock:ro
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@db:5432/aerotwin
      JWT_SECRET: local-dev-secret-change-in-production
      MQTT_BROKER_URL: mqtt://mqtt:1883
      REDIS_URL: redis://redis:6379/0
      ENVIRONMENT: development
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: gemini-3.5-flash
      # dev only: hot-reload the bind-mounted source (never set in a deployed image)
      UVICORN_RELOAD: "1"
      # On-demand simulator: backend controls the simulator container via Docker socket.
      SIMULATOR_USE_DOCKER: "true"
      SIMULATOR_CONTAINER_NAME: aerotwin-simulator
      # Network name = <compose-project-name>_default  (project = folder name = docker)
      DOCKER_NETWORK: aerotwin_default
      SIMULATOR_IMAGE: aerotwin-simulator:latest
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      mqtt:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/healthz')\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  # ── On-demand simulator (DEV/DEMO) ──────────────────────────────────────
  # NOT auto-started by `docker compose up`.  The backend API starts/stops it
  # when a user clicks "START SIM" on the Dashboard (POST /api/v1/simulator/start).
  #
  # Build context = repo root so the prod Dockerfile can COPY source into the
  # image, making it self-contained (no bind mounts).  The backend starts this
  # via the Docker socket, so it must be a standalone image.
  simulator:
    build:
      context: ../..                        # repo root
      dockerfile: infra/docker/Dockerfile.simulator
    image: aerotwin-simulator:latest
    container_name: aerotwin-simulator
    profiles:
      - demo          # excluded from default `up`; started on-demand by the backend API
    restart: "no"     # do NOT auto-restart — the backend controls the lifecycle
    environment:
      MQTT_HOST: mqtt
      ENGINE_ID: ${ENGINE_ID:-00000000-0000-0000-0000-000000000001}
    depends_on:
      mqtt:
        condition: service_started
    stdin_open: false

  # ── React frontend (built + served by nginx — no Node at runtime) ──
  frontend:
    build:
      context: ../../frontend
      dockerfile: ../infra/docker/Dockerfile.frontend
      args:
        VITE_API_URL: http://localhost:8000/api/v1
        VITE_WS_URL: ws://localhost:8000/api/v1
    container_name: aerotwin-frontend
    restart: unless-stopped
    ports:
      - "5175:80"
    depends_on:
      - backend
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost/"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

volumes:
  pgdata:
