name: aerotwin
version: '3.9'

services:
  # ── PostgreSQL + TimescaleDB ──
  db:
    image: timescale/timescaledb:latest-pg16
    container_name: aerotwin-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: aerotwin
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ── Redis (caching / pub-sub) ──
  redis:
    image: redis:7-alpine
    container_name: aerotwin-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ── MQTT Broker ──
  mqtt:
    image: eclipse-mosquitto:2
    container_name: aerotwin-mqtt
    restart: unless-stopped
    ports:
      - "1883:1883"
      - "9001:9001"
    volumes:
      - ./mosquitto.conf:/mosquitto/config/mosquitto.conf
    healthcheck:
      test: ["CMD-SHELL", "mosquitto_sub -t '$$SYS/#' -C 1 -i healthcheck -W 3 || exit 0"]
      interval: 10s
      timeout: 5s
      retries: 3

  # ── FastAPI Backend ──
  backend:
    build:
      # Repo root: the image needs ml/ and simulation/ as well as backend/.
      context: ../..
      dockerfile: infra/docker/Dockerfile.backend
    container_name: aerotwin-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - ../../backend:/app
      - ../../ml:/ml
      # Phase 6's simulation package lives at the repo root, a sibling of
      # backend/ and ml/ — app/api/v1/simulation.py resolves it the same
      # way bearing_service.py resolves ml/ (walking up from /app to the
      # container root), so it needs the same kind of mount or replay/
      # what-if 404s with ModuleNotFoundError inside the container even
      # though it works fine when run outside Docker.
      - ../../simulation:/simulation
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@db:5432/aerotwin
      JWT_SECRET: local-dev-secret-change-in-production
      MQTT_BROKER_URL: mqtt://mqtt:1883
      REDIS_URL: redis://redis:6379/0
      ENVIRONMENT: development
      # dev only: hot-reload the bind-mounted source (never set in a deployed image)
      UVICORN_RELOAD: "1"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      mqtt:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/healthz')\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  # ── React frontend (built + served by nginx — no Node at runtime) ──
  frontend:
    build:
      context: ../../frontend
      dockerfile: ../infra/docker/Dockerfile.frontend
      args:
        VITE_API_URL: http://localhost:8000/api/v1
        VITE_WS_URL: ws://localhost:8000/api/v1
    container_name: aerotwin-frontend
    restart: unless-stopped
    ports:
      - "5175:80"
    depends_on:
      - backend
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost/"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

volumes:
  pgdata:
