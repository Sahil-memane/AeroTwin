# Production broker. per_listener_settings lets the internal and external listeners differ.
per_listener_settings true
persistence true
persistence_location /mosquitto/data/

# Internal listener: only reachable on the docker network (not published), used by the backend.
listener 1883
allow_anonymous true

# External listener for edge agents: username/password required. Published on 127.0.0.1 by default;
# set MQTT_EDGE_BIND=0.0.0.0 AND add TLS (certfile/keyfile/cafile below) before exposing it.
listener 8883
allow_anonymous false
password_file /mosquitto/config/passwd
# certfile /mosquitto/certs/fullchain.pem
# keyfile  /mosquitto/certs/privkey.pem
