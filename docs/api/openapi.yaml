openapi: 3.1.0
info:
  title: AeroTwin API
  version: 1.0.0
paths:
  /api/v1/auth/login:
    post:
      tags:
      - auth
      summary: Login
      description: 'Authenticate a user and return JWT tokens.

        Rate-limited to 5 attempts per minute per IP.'
      operationId: login_api_v1_auth_login_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/auth/refresh:
    post:
      tags:
      - auth
      summary: Refresh
      description: Validate a refresh token (rejecting an access token) and issue a new access token.
      operationId: refresh_api_v1_auth_refresh_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/users:
    get:
      tags:
      - users
      summary: List Users
      description: List all users. Admin only.
      operationId: list_users_api_v1_users_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/User'
                type: array
                title: Response List Users Api V1 Users Get
      security:
      - OAuth2PasswordBearer: []
    post:
      tags:
      - users
      summary: Create User
      description: Create a new user. Admin only.
      operationId: create_user_api_v1_users_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserCreate'
        required: true
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - OAuth2PasswordBearer: []
  /api/v1/users/{user_id}:
    get:
      tags:
      - users
      summary: Get User
      description: Get a single user by ID. Admin only.
      operationId: get_user_api_v1_users__user_id__get
      security:
      - OAuth2PasswordBearer: []
      parameters:
      - name: user_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: User Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    put:
      tags:
      - users
      summary: Update User
      description: Update a user. Admin only.
      operationId: update_user_api_v1_users__user_id__put
      security:
      - OAuth2PasswordBearer: []
      parameters:
      - name: user_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: User Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserUpdate'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    delete:
      tags:
      - users
      summary: Delete User
      description: Delete a user. Admin only.
      operationId: delete_user_api_v1_users__user_id__delete
      security:
      - OAuth2PasswordBearer: []
      parameters:
      - name: user_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: User Id
      responses:
        '204':
          description: Successful Response
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/uav-assets:
    get:
      tags:
      - uav-assets
      summary: List Uav Assets
      description: List all UAV assets. Any authenticated user.
      operationId: list_uav_assets_api_v1_uav_assets_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/UAVAsset'
                type: array
                title: Response List Uav Assets Api V1 Uav Assets Get
      security:
      - OAuth2PasswordBearer: []
    post:
      tags:
      - uav-assets
      summary: Create Uav Asset
      description: Create a new UAV asset. Admin or Program Manager only.
      operationId: create_uav_asset_api_v1_uav_assets_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UAVAssetCreate'
        required: true
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UAVAsset'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - OAuth2PasswordBearer: []
  /api/v1/uav-assets/{asset_id}:
    get:
      tags:
      - uav-assets
      summary: Get Uav Asset
      description: Get a single UAV asset by ID.
      operationId: get_uav_asset_api_v1_uav_assets__asset_id__get
      security:
      - OAuth2PasswordBearer: []
      parameters:
      - name: asset_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Asset Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UAVAsset'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    put:
      tags:
      - uav-assets
      summary: Update Uav Asset
      description: Update a UAV asset. Admin or Program Manager only.
      operationId: update_uav_asset_api_v1_uav_assets__asset_id__put
      security:
      - OAuth2PasswordBearer: []
      parameters:
      - name: asset_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Asset Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UAVAssetUpdate'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UAVAsset'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    delete:
      tags:
      - uav-assets
      summary: Delete Uav Asset
      description: Delete a UAV asset. Admin only.
      operationId: delete_uav_asset_api_v1_uav_assets__asset_id__delete
      security:
      - OAuth2PasswordBearer: []
      parameters:
      - name: asset_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Asset Id
      responses:
        '204':
          description: Successful Response
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/engines:
    get:
      tags:
      - engines
      summary: List Engines
      description: List all engines. Any authenticated user.
      operationId: list_engines_api_v1_engines_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/Engine'
                type: array
                title: Response List Engines Api V1 Engines Get
      security:
      - OAuth2PasswordBearer: []
    post:
      tags:
      - engines
      summary: Create Engine
      description: Create a new engine. Admin or Program Manager only.
      operationId: create_engine_api_v1_engines_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EngineCreate'
        required: true
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Engine'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - OAuth2PasswordBearer: []
  /api/v1/engines/{engine_id}:
    get:
      tags:
      - engines
      summary: Get Engine
      description: Get a single engine by ID.
      operationId: get_engine_api_v1_engines__engine_id__get
      security:
      - OAuth2PasswordBearer: []
      parameters:
      - name: engine_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Engine Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Engine'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    put:
      tags:
      - engines
      summary: Update Engine
      description: Update an engine. Admin, Program Manager, or Maintenance Engineer.
      operationId: update_engine_api_v1_engines__engine_id__put
      security:
      - OAuth2PasswordBearer: []
      parameters:
      - name: engine_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Engine Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EngineUpdate'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Engine'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    delete:
      tags:
      - engines
      summary: Delete Engine
      description: Delete an engine. Admin only.
      operationId: delete_engine_api_v1_engines__engine_id__delete
      security:
      - OAuth2PasswordBearer: []
      parameters:
      - name: engine_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Engine Id
      responses:
        '204':
          description: Successful Response
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/engines/{engine_id}/health-score:
    get:
      tags:
      - engines
      summary: Get Health Score
      description: 'Get the current fused health score for an engine, plus a recent

        historical trend (computed by `health_fusion.py` on every telemetry

        message and persisted to `health_scores` — see Phase 4).'
      operationId: get_health_score_api_v1_engines__engine_id__health_score_get
      security:
      - OAuth2PasswordBearer: []
      parameters:
      - name: engine_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Engine Id
      - name: history_limit
        in: query
        required: false
        schema:
          type: integer
          default: 50
          title: History Limit
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/engines/{engine_id}/telemetry/latest:
    get:
      tags:
      - engines
      summary: Get Latest Telemetry
      description: Get the most recent telemetry reading for an engine.
      operationId: get_latest_telemetry_api_v1_engines__engine_id__telemetry_latest_get
      security:
      - OAuth2PasswordBearer: []
      parameters:
      - name: engine_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Engine Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TelemetryReading'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/engines/{engine_id}/rul:
    get:
      tags:
      - engines
      summary: Get Rul Predictions
      description: 'Get the most recent RUL predictions for an engine, optionally ranged

        by `from`/`to`. NOTE: this endpoint (not a separate `api/v1/rul.py`

        router) is the one and only implementation of `GET .../rul` — a

        second router mounted under the same `engines` prefix at the same

        path would create an ambiguous route, so `rul.py` is intentionally

        left empty. See the Phase 4.0 plan notes.'
      operationId: get_rul_predictions_api_v1_engines__engine_id__rul_get
      security:
      - OAuth2PasswordBearer: []
      parameters:
      - name: engine_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Engine Id
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          default: 100
          title: Limit
      - name: from
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: From
      - name: to
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: To
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/RulPrediction'
                title: Response Get Rul Predictions Api V1 Engines  Engine Id  Rul Get
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/engines/{engine_id}/rul/status:
    get:
      tags:
      - engines
      summary: Get Rul Status
      description: 'Accuracy-First Phase 2. Distinguishes "this engine has never had

        enough telemetry to produce a RUL prediction yet" from "no

        prediction has ever been persisted" (previously indistinguishable —

        both showed as an empty `GET /rul` list). Reads `rul_service`''s

        in-memory window depth directly — no DB query, O(1), always

        up to date with the live ingestion process this API server runs in.'
      operationId: get_rul_status_api_v1_engines__engine_id__rul_status_get
      security:
      - OAuth2PasswordBearer: []
      parameters:
      - name: engine_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Engine Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/engines/{engine_id}/physics-consistency:
    get:
      tags:
      - engines
      summary: Get Physics Consistency
      description: 'Accuracy-First Phase 4. The latest expected-vs-measured comparison

        for each of the 5 channels the Otto-cycle physics model covers

        (CHT, EGT, oil pressure, oil temp, fuel flow) — computed by every

        live ingestion cycle (`physics_ingestion.py`) and persisted to

        `physics_deviation_readings`, one row per (engine, ts, parameter).

        Uses Postgres `DISTINCT ON` since each channel can in principle be

        updated at a slightly different cadence — this always returns each

        channel''s own most recent row, not just the 5 rows from one ts.'
      operationId: get_physics_consistency_api_v1_engines__engine_id__physics_consistency_get
      security:
      - OAuth2PasswordBearer: []
      parameters:
      - name: engine_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Engine Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/missions:
    get:
      tags:
      - missions
      summary: List Missions
      description: List all missions. Any authenticated user.
      operationId: list_missions_api_v1_missions_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/Mission'
                type: array
                title: Response List Missions Api V1 Missions Get
      security:
      - OAuth2PasswordBearer: []
    post:
      tags:
      - missions
      summary: Create Mission
      description: Create a new mission. Operator, Program Manager, or Admin.
      operationId: create_mission_api_v1_missions_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MissionCreate'
        required: true
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Mission'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - OAuth2PasswordBearer: []
  /api/v1/missions/{mission_id}:
    get:
      tags:
      - missions
      summary: Get Mission
      description: 'Get a single mission by ID, with a compact telemetry summary —

        never the raw readings themselves (see /engines/{id}/telemetry for

        that, already range/limit-capped).'
      operationId: get_mission_api_v1_missions__mission_id__get
      security:
      - OAuth2PasswordBearer: []
      parameters:
      - name: mission_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Mission Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MissionDetail'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    put:
      tags:
      - missions
      summary: Update Mission
      description: Update a mission. Operator, Program Manager, or Admin.
      operationId: update_mission_api_v1_missions__mission_id__put
      security:
      - OAuth2PasswordBearer: []
      parameters:
      - name: mission_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Mission Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MissionUpdate'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Mission'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    delete:
      tags:
      - missions
      summary: Delete Mission
      description: Delete a mission. Admin only.
      operationId: delete_mission_api_v1_missions__mission_id__delete
      security:
      - OAuth2PasswordBearer: []
      parameters:
      - name: mission_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Mission Id
      responses:
        '204':
          description: Successful Response
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/dashboard/summary:
    get:
      tags:
      - dashboard
      summary: Dashboard Summary
      description: Return a high-level dashboard summary, including fused fleet health and recent alerts.
      operationId: dashboard_summary_api_v1_dashboard_summary_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
      security:
      - OAuth2PasswordBearer: []
  /api/v1/engines/{engine_id}/faults/latest:
    get:
      tags:
      - faults
      summary: Get Latest Fault
      description: Get the most recent fault prediction for an engine.
      operationId: get_latest_fault_api_v1_engines__engine_id__faults_latest_get
      security:
      - OAuth2PasswordBearer: []
      parameters:
      - name: engine_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Engine Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FaultPrediction'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/engines/{engine_id}/bearing-health:
    get:
      tags:
      - bearing
      summary: Get Latest Bearing Health
      description: 'Get the most recent bearing-health reading for an engine.


        Serves the model''s real fields (class_id, class_label, fault_location,

        severity_inches, confidence) rather than the Implementation Document''s

        Section 12.4 `severity_score`, which does not exist on this model —

        see the plan''s Phase 4.0 sign-off note.'
      operationId: get_latest_bearing_health_api_v1_engines__engine_id__bearing_health_get
      security:
      - OAuth2PasswordBearer: []
      parameters:
      - name: engine_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Engine Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BearingHealthReading'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/engines/{engine_id}/aux-latest:
    get:
      tags:
      - aux
      summary: Get Latest Aux
      description: Get the most recent auxiliary predictive-maintenance prediction for an engine.
      operationId: get_latest_aux_api_v1_engines__engine_id__aux_latest_get
      security:
      - OAuth2PasswordBearer: []
      parameters:
      - name: engine_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Engine Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuxPrediction'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/engines/{engine_id}/maintenance-logs:
    get:
      tags:
      - maintenance
      summary: List Maintenance Logs
      description: List maintenance actions logged against an engine, most recent first.
      operationId: list_maintenance_logs_api_v1_engines__engine_id__maintenance_logs_get
      security:
      - OAuth2PasswordBearer: []
      parameters:
      - name: engine_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Engine Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/MaintenanceLog'
                title: Response List Maintenance Logs Api V1 Engines  Engine Id  Maintenance Logs Get
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    post:
      tags:
      - maintenance
      summary: Create Maintenance Log
      description: Log a maintenance action taken on an engine.
      operationId: create_maintenance_log_api_v1_engines__engine_id__maintenance_logs_post
      security:
      - OAuth2PasswordBearer: []
      parameters:
      - name: engine_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Engine Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MaintenanceLogCreate'
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MaintenanceLog'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/telemetry/ingest:
    post:
      tags:
      - telemetry
      summary: Ingest Telemetry
      description: 'REST ingestion path for edge devices that can''t use MQTT. Shares the

        same validation as the MQTT path (`app.services.validation`) so the

        two ingestion routes can never silently drift on what''s plausible.'
      operationId: ingest_telemetry_api_v1_telemetry_ingest_post
      parameters:
      - name: x-edge-api-key
        in: header
        required: true
        schema:
          type: string
          title: X-Edge-Api-Key
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
              title: Payload
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/engines/{engine_id}/telemetry:
    get:
      tags:
      - telemetry
      summary: Get Telemetry Range
      description: Ranged telemetry query. Range is capped at 30 days to protect the hypertable.
      operationId: get_telemetry_range_api_v1_engines__engine_id__telemetry_get
      security:
      - OAuth2PasswordBearer: []
      parameters:
      - name: engine_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Engine Id
      - name: from
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: From
      - name: to
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: To
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          maximum: 5000
          default: 500
          title: Limit
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TelemetryReading'
                title: Response Get Telemetry Range Api V1 Engines  Engine Id  Telemetry Get
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/models:
    get:
      tags:
      - models
      summary: List Models
      description: 'List registered model versions, optionally filtered by model_name.


        Serves the ModelRegistry table''s real columns (model_name, version,

        is_active, validation_score, registered_at) — the Implementation

        Document''s Section 12.4 `framework`/`trained_at` fields don''t exist on

        this table and aren''t invented here; see the plan''s Phase 4.0 sign-off.'
      operationId: list_models_api_v1_models_get
      security:
      - OAuth2PasswordBearer: []
      parameters:
      - name: model_name
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Model Name
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ModelRegistry'
                title: Response List Models Api V1 Models Get
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/alerts:
    get:
      tags:
      - alerts
      summary: List Alerts
      description: 'List alerts, filterable by engine, severity, and acknowledgement state.

        `is_acknowledged` omitted returns both; explicit true/false filters.'
      operationId: list_alerts_api_v1_alerts_get
      security:
      - OAuth2PasswordBearer: []
      parameters:
      - name: engine_id
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            format: uuid
          - type: 'null'
          title: Engine Id
      - name: severity
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Severity
      - name: is_acknowledged
        in: query
        required: false
        schema:
          anyOf:
          - type: boolean
          - type: 'null'
          title: Is Acknowledged
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Alert'
                title: Response List Alerts Api V1 Alerts Get
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/alerts/{alert_id}/acknowledge:
    patch:
      tags:
      - alerts
      summary: Acknowledge Alert
      description: 'Acknowledge an alert. Idempotent-safe: acknowledging twice is a 409.'
      operationId: acknowledge_alert_api_v1_alerts__alert_id__acknowledge_patch
      security:
      - OAuth2PasswordBearer: []
      parameters:
      - name: alert_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Alert Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Alert'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/copilot/query:
    post:
      tags:
      - copilot
      summary: Query Copilot
      description: 'Ask the AeroTwin Maintenance Copilot a question. Answered from the

        static AeroTwin knowledge base (RAG), live engine data (when the

        question and `engine_id` call for it), or both — see

        AeroTwin_Rag/context_selector.py for how that''s decided.'
      operationId: query_copilot_api_v1_copilot_query_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CopilotQuery'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CopilotResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - OAuth2PasswordBearer: []
  /api/v1/simulation/run:
    post:
      tags:
      - simulation
      summary: Create Simulation Run
      description: 'Kick off a replay (historical mission, re-run through the ML pipeline

        at accelerated speed) or a what-if (synthetic scenario) simulation.

        Runs in the background; poll `GET /simulation/{id}` for the result.'
      operationId: create_simulation_run_api_v1_simulation_run_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SimulationRunCreate'
        required: true
      responses:
        '202':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - OAuth2PasswordBearer: []
  /api/v1/simulation/what-if/config:
    get:
      tags:
      - simulation
      summary: Get What If Config
      description: Slider metadata (min/max/step/unit) and window settings for the What-If UI.
      operationId: get_what_if_config_api_v1_simulation_what_if_config_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
      security:
      - OAuth2PasswordBearer: []
  /api/v1/simulation/what-if:
    post:
      tags:
      - simulation
      summary: Run What If Scenario
      description: 'Parameter-perturbation What-If: runs the engine''s recent REAL telemetry

        window, with the requested parameter change applied in memory to the

        last K readings, through the existing RUL/Fault/Bearing/Aux models and

        Health Fusion, and compares against the unmodified window.


        Strictly read-only: writes no telemetry, predictions, health scores or

        alerts, broadcasts nothing, and does not touch live model state.

        Synchronous (returns the finished result; `simulation_status` says how

        it ended).'
      operationId: run_what_if_scenario_api_v1_simulation_what_if_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WhatIfRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - OAuth2PasswordBearer: []
  /api/v1/simulation/{simulation_id}:
    get:
      tags:
      - simulation
      summary: Get Simulation Run
      operationId: get_simulation_run_api_v1_simulation__simulation_id__get
      security:
      - OAuth2PasswordBearer: []
      parameters:
      - name: simulation_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Simulation Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /healthz:
    get:
      summary: Healthz
      operationId: healthz_healthz_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
