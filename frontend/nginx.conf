server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # React Router uses client-side routing — any path that isn't a real
    # static file (e.g. /engines/abc/simulation) must still serve
    # index.html so the router can take over, or a hard refresh 404s.
    location / {
        try_files $uri $uri/ /index.html;
    }

    location = /healthz {
        access_log off;
        return 200 "ok\n";
    }
}
